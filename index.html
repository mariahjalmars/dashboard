:root{
  --paper:#EFE9DD; --card:#FAF7F0; --ink:#1B1F23; --mute:#6D6A60; --line:#DCD3C2; --line2:#E9E2D4;
  --maja:#C8901A; --elly:#C23A30; --hjalmar:#1F6BA5; --family:#4B8A58; --school:#8D8777;
  --sea:#2A5F7A; --dayc:#F2C14E;
  --hp:46px;
  --f:'Schibsted Grotesk',system-ui,sans-serif; --fc:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--paper)}
body{font:15px/1.35 var(--f);color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.roofs{height:7px;background:linear-gradient(90deg,var(--elly) 0 22%,var(--maja) 22% 44%,var(--hjalmar) 44% 66%,var(--family) 66% 88%,var(--sea) 88%)}
.wrap{max-width:1500px;margin:0 auto;padding:18px 20px 40px}
/* top */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:8px 28px;align-items:end}
.clock{font:700 56px/0.9 var(--fc);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.clock small{font-size:34px;color:var(--mute);margin-left:6px;font-weight:600}
.date{padding-bottom:4px}
.date .dow{font:600 26px/1 var(--fc);text-transform:uppercase;letter-spacing:.08em;color:var(--elly)}
.date .dn{font-size:17px;color:var(--mute);margin-top:4px}
.wx{display:flex;align-items:center;gap:14px;text-align:right}
.wx .t{font:700 54px/0.9 var(--fc)}
.wx .d{font-size:13px;color:var(--mute);line-height:1.35;text-align:left}
.wx .d b{color:var(--ink);font-weight:600;font-size:15px}
.fc{display:flex;gap:10px;margin-left:8px;padding-left:14px;border-left:1px solid var(--line)}
.fc div{font-size:12px;color:var(--mute);text-align:center;min-width:34px}
.fc b{display:block;font:600 17px/1.1 var(--fc);color:var(--ink)}
.sky{grid-column:1/-1;position:relative;height:30px;margin-top:10px}
.sky .bar{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:#cfc7b6}
.sky .day{position:absolute;top:7px;height:8px;border-radius:4px;background:linear-gradient(90deg,#f5d37a,var(--dayc),#f5d37a)}
.sky .tk{position:absolute;top:0;font-size:12px;color:var(--mute);transform:translateX(-50%)}
.sky .now{position:absolute;top:3px;width:3px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.sky .lb{position:absolute;top:-2px;font:600 13.5px var(--fc);color:var(--ink);transform:translateX(-50%)}
/* layout */
.main{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:18px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px}
.daybar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.daybar h2{font:700 30px/1 var(--fc);text-transform:uppercase;letter-spacing:.04em;margin-right:auto}
.daybar h2 span{font-weight:500;color:var(--mute);font-size:20px;margin-left:8px;text-transform:none;letter-spacing:0}
.btn{border:1px solid var(--line);border-radius:4px;padding:6px 11px;font-size:13.5px;background:var(--card);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.cols{display:grid;gap:0;padding:0 8px 12px 0}
.axis{position:relative}
.axis i{position:absolute;right:8px;font:600 13px/1 var(--fc);color:var(--mute);font-style:normal;transform:translateY(-50%)}
.lane{min-width:0;border-left:1px solid var(--line2)}
.lb2{position:relative;overflow:hidden}
.lh{padding:10px 10px 8px;border-top:5px solid var(--c);margin-top:12px;border-left:1px solid var(--line2);min-width:0}
.lh button.nm{font:700 24px/1 var(--fc);text-transform:uppercase;letter-spacing:.06em;color:var(--c);display:flex;align-items:center;gap:6px;text-align:left}
.lh button.nm.click:after{content:'›';font-size:22px;opacity:.55;transition:.15s}
.lh button.nm.click:hover:after{transform:translateX(3px);opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:0}
.chip{font-size:12px;padding:2px 7px;border-radius:3px;background:color-mix(in srgb,var(--c,var(--school)) 14%,#fff);border:1px solid color-mix(in srgb,var(--c,var(--school)) 35%,#fff);line-height:1.3}
.chip.off{background:repeating-linear-gradient(135deg,#e5dfd1 0 5px,#efeadf 5px 10px);border-color:#cfc7b6;color:#4a463d;font-weight:600}
.lb2{position:relative;height:calc(var(--rows)*var(--hp));background:repeating-linear-gradient(to bottom,var(--line2) 0 1px,transparent 1px var(--hp))}
.ev{position:absolute;border-radius:3px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);padding:3px 6px;overflow:hidden;font-size:12.5px;line-height:1.25;box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent) inset}
.ev b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.sm{display:flex;gap:6px;align-items:baseline;padding-top:1px;padding-bottom:1px}
.ev.sm span{display:inline}
.ev.school{--c:var(--school);background:repeating-linear-gradient(135deg,#e7e1d3 0 6px,#eee9de 6px 12px)}

/* ── GOOGLE DAGATAL ───────────────────────────────────────────── */
const CLIENT_ID='865507997051-8a0l6dpl5dsk278mpnll9spmfqs1re79.apps.googleusercontent.com';
const ABLER_ID='b0eba4b68ed087637cb8323c4f080a41deb260eb92fb42a7b2ba29df0e8a53f3@group.calendar.google.com';
const SCOPE='https://www.googleapis.com/auth/calendar.readonly';
const redirectUri=()=>location.origin+location.pathname;
function startAuth(silent){
  const q=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:redirectUri(),response_type:'token',scope:SCOPE,include_granted_scopes:'true'});
  if(silent) q.set('prompt','none');
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+q;
}
function trySilent(){
  try{const t=+sessionStorage.getItem('fd_try')||0; if(Date.now()-t<5*60e3) return false; sessionStorage.setItem('fd_try',String(Date.now()));}catch(e){return false}
  startAuth(true); return true;
}
function saveTok(t,secs){const exp=Date.now()+Math.max(60,(+secs||3600)-90)*1000;try{localStorage.setItem('fd_tok',JSON.stringify({t,exp}));localStorage.setItem('fd_was','1')}catch(e){}return exp}
function loadTok(){try{const o=JSON.parse(localStorage.getItem('fd_tok')||'null');if(o&&o.t&&o.exp>Date.now()+30e3)return o}catch(e){}return null}
function clearTok(){try{localStorage.removeItem('fd_tok')}catch(e){}}
const wasConnected=()=>{try{return localStorage.getItem('fd_was')==='1'}catch(e){return false}};

function classify(c){
  const name=fold(c.summaryOverride||c.summary).trim(),id=c.id||'';
  if(id.includes('#holiday@'))return null;
  if(name.startsWith('abler'))return 'abler';
  if(name==='elly')return 'elly';
  if(name==='hjalmar')return 'hjalmar';
  if(name==='family')return 'family';
  if(c.primary)return 'maja';
  if(id.endsWith('@import.calendar.google.com'))return null;
  return 'maja';
}
function shortLoc(loc){
  if(!loc)return '';
  return loc.split(',').map(s=>s.trim()).filter(s=>s&&!['Iceland','Reykjavík','Reykjavik','Ísland'].includes(fold(s)===fold(s)?s:s)).filter(s=>!['iceland','reykjavik','island'].includes(fold(s))).slice(0,2).join(', ');
}
function normalize(ev,cal){
  if(!ev||ev.status==='cancelled'||!ev.start)return null;
  const allDay=!!ev.start.date;
  let who=cal.kind,title=String(ev.summary||'(atburður)').normalize('NFC'),cancelled=false;
  if(cal.kind==='abler'){
    const cm=fold(title).match(/^afl[a-z]*st[:\s-]+/);
    if(cm){cancelled=true;title=title.slice(cm[0].length)}
    const i=title.indexOf('·');
    let head='',rest=title;
    if(i>-1){head=title.slice(0,i);rest=title.slice(i+1).trim()}
    const fh=fold(head);
    who=fh.includes('elly')?'elly':fh.includes('hjalmar')?'hjalmar':'family';
    const dash=rest.indexOf(' – ');
    title=(dash>-1?rest.slice(dash+3):rest).trim();
    if(/^afl[a-zý]*st/i.test(fold(title))&&!cancelled){cancelled=true}
  }
  const e={key:cal.id+'|'+ev.id,who,title:title.trim(),loc:shortLoc(ev.location),allDay,cancelled};
  if(allDay){e.date=ev.start.date;e.endDate=(ev.end&&ev.end.date)||ev.start.date}
  else{const s=new Date(ev.start.dateTime),en=new Date(ev.end.dateTime);e.date=dkey(s);e.s=s.getHours()*60+s.getMinutes();e.e=en.getTime()-s.getTime()>0?(dkey(en)===e.date?en.getHours()*60+en.getMinutes():1440):e.s+30;e.endTs=en.getTime()}
  return e;
}
function gEventsFor(ds,whos){
  const out=[],seen=new Set();
  G.events.forEach(e=>{
    if(!whos.includes(e.who))return;
    const hit=e.allDay?(ds>=e.date&&(ds<e.endDate||ds===e.date)):e.date===ds;
    if(!hit)return;
    if(!e.allDay){const k=e.who+'|'+e.s+'|'+e.e+'|'+e.title;if(seen.has(k))return;seen.add(k)}
    out.push(e);
  });
  return out;
}
async function gFetch(url){
  const r=await fetch(url,{headers:{Authorization:'Bearer '+G.token}});
  if(r.status===401){authLost();throw new Error('auth')}
  if(!r.ok)throw new Error('http '+r.status);
  return r.json();
}
function authLost(){G.token=null;G.loaded=false;clearTok();setStatus('off');renderAll();trySilent()}

  const d=await gFetch('https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=100');

  if(!G.cals.some(c=>c.id===ABLER_ID))G.cals.push({id:ABLER_ID,kind:'abler'});

async function ensureMonth(y,m,force){
  if(!G.token)return;
  const key=y+'-'+m;
  if(!force&&G.months.has(key))return;
  const min=encodeURIComponent(new Date(y,m,1).toISOString()),max=encodeURIComponent(new Date(y,m+1,1).toISOString());
  let failed=false;
  const batches=await Promise.all(G.cals.map(async cal=>{
    try{
      let items=[],tok='';
      do{
        const d=await gFetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?timeMin=${min}&timeMax=${max}&singleEvents=true&orderBy=startTime&maxResults=250`+(tok?'&pageToken='+tok:''));
        items=items.concat(d.items||[]);tok=d.nextPageToken||'';
      }while(tok);
      return items.map(ev=>normalize(ev,cal)).filter(Boolean);
    }catch(e){if(e.message==='auth')throw e;failed=true;return[]}
  }));
  if(!failed){const pre=y+'-'+p2(m+1);G.events.forEach((e,k)=>{if(e.date.startsWith(pre))G.events.delete(k)})}
  batches.flat().forEach(e=>G.events.set(e.key,e));
  if(!failed)G.months.add(key);else throw new Error('partial');
}

function laneData(who,ds,detail){
  const ev=[],chips=[];let note='';
  const now=new Date(),isToday=ds===dkey(now),nowM=now.getHours()*60+now.getMinutes();
  const past=e=>ds<dkey(now)||(isToday&&e<=nowM);
  const push=(o)=>{o.who=o.who||who;o.past=past(o.e);ev.push(o)};
  if(who==='maja'){
    gEventsFor(ds,['maja','family']).forEach(e=>{
      if(e.allDay)chips.push({t:e.title,c:e.who==='family'?'var(--family)':null});
      else push({s:e.s,e:e.e,title:e.title,loc:e.loc,kind:'event',who:e.who,cancelled:e.cancelled});
    });
  }else{
    const sd=schoolDay(who,ds);
    if(sd&&sd.off)chips.push({t:sd.off+' – enginn skóli',off:true});
    else if(sd){
      if(sd.note)chips.push({t:sd.note});
      if(sd.lessons.length){
        if(detail)sd.lessons.forEach(l=>push({s:l.s,e:l.e,title:l.title,kind:l.kind}));
        else push({s:sd.lessons[0].s,e:sd.lessons[sd.lessons.length-1].e,title:'Skóli',loc:'Hagaskóli',kind:'school'});
      }
    }
    gEventsFor(ds,[who]).forEach(e=>{
      if(e.allDay)chips.push({t:e.title});
      else push({s:e.s,e:e.e,title:e.title,loc:e.loc,kind:'event',cancelled:e.cancelled});
    });
    ONEOFF[who].filter(o=>o.date===ds).forEach(o=>{
      if(o.allDay)chips.push({t:o.title,strong:true});else push({s:mins(o.start),e:mins(o.end),title:o.title,loc:o.loc||'',kind:'event'});
    });
    G.events.forEach(e=>{if(e.who==='family'&&0)0});
  }
  ev.sort((a,b)=>a.s-b.s||b.e-a.e);
  return {ev,chips};
}
function layoutCols(evs){
  let cl=[],cEnd=0;const out=[];
  const flush=()=>{const cols=[];cl.forEach(e=>{let i=cols.findIndex(c=>c<=e.s);if(i<0){i=cols.length;cols.push(0)}cols[i]=e.e;e.col=i});cl.forEach(e=>e.cols=cols.length);out.push(...cl);cl=[]};
  evs.forEach(e=>{if(cl.length&&e.s>=cEnd){flush();cEnd=0}cl.push(e);cEnd=Math.max(cEnd,e.e)});
  if(cl.length)flush();return out;
}

  if(isToday){hi=Math.max(hi,Math.min(1440,Math.ceil((now.getHours()*60+now.getMinutes()+30)/60)*60))}

    }else{
      const evv=ev.filter(e=>e.e>lo);

        const s0=Math.max(e.s,lo),h=Math.max(20,(e.e-s0)/60*hp-2),top=(s0-lo)/60*hp+1;

  });
  html+='</div>';
  if(mob)html=`<div class="tabs">${['maja','elly','hjalmar'].map(w=>`<button data-t="${w}" class="${state.tab===w?'on':''}" style="--c:${WHO[w].c}">${WHO[w].name}</button>`).join('')}</div>`+html;
  $('lanes').innerHTML=html;
  document.querySelectorAll('#lanes .tabs button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;renderDay()});

}

function nextUp(who){
  const now=new Date(),t0=dkey(now),nm=now.getHours()*60+now.getMinutes();
  for(let i=0;i<8;i++){
    const ds=addDays(t0,i),{ev,chips}=laneData(who,ds,false);
    const c=ev.filter(e=>!e.cancelled&&(i>0||e.e>nm)).sort((a,b)=>a.s-b.s);
    const act=c.find(e=>e.kind==='event')||c[0];
    if(!act)continue;
    const d=parseD(ds);
    const when=i===0?'Í dag':i===1?'Á morgun':DOW[d.getDay()];
    const ongoing=i===0&&act.s<=nm;
    return {title:act.title,sub:(ongoing?'núna til '+fmtT(act.e):when+' '+fmtT(act.s))+(act.loc?' · '+act.loc:'')};
  }
  return null;
}

/* ── SJÁVARFÖLL (Open-Meteo Marine, sama og Strandvaktin) ─────── */
let T=null,tideErr=false;
async function loadTides(){
  const ck='fd_tide3',today=todayKey();
  try{const c=JSON.parse(localStorage.getItem(ck)||'null');if(c&&c.day===today&&Date.now()-c.t<6*3600e3){T=c.d;renderTide();return}}catch(e){}
  const base='https://marine-api.open-meteo.com/v1/marine?latitude=64.15&longitude=-21.93&hourly=sea_level_height_msl&timezone=Atlantic%2FReykjavik&past_days=2&forecast_days=9';
  for(const m of ['&models=smoc','']){
    try{
      const r=await fetchJ(base+m);
      if(r.hourly&&r.hourly.sea_level_height_msl&&r.hourly.sea_level_height_msl.filter(v=>v!=null).length>24){
        T={time:r.hourly.time,v:r.hourly.sea_level_height_msl};
        try{localStorage.setItem(ck,JSON.stringify({day:today,t:Date.now(),d:T}))}catch(e){}
        tideErr=false;renderTide();return;
      }
    }catch(e){}
  }
  T=null;tideErr=true;renderTide();
}
function tideDay(ds){
  if(!T)return null;
  const pts=[],ex=[];
  for(let i=0;i<T.time.length;i++){
    const t=T.time[i];
    if(!t.startsWith(ds)&&!(t.startsWith(addDays(ds,1))&&t.endsWith('T00:00')))continue;
    const v=T.v[i];if(v==null)continue;
    const m=t.startsWith(ds)?+t.slice(11,13)*60+(+t.slice(14,16)):1440;
    pts.push({m,v});
    const a=T.v[i-1],b=T.v[i+1];
    if(t.startsWith(ds)&&a!=null&&b!=null){
      if(v>a&&v>=b)ex.push({m,v,hi:true});
      else if(v<a&&v<=b)ex.push({m,v,hi:false});
    }
  }
  return pts.length>=20?{pts,ex}:null;
}
function smooth(p){let d=`M${p[0].x.toFixed(1)},${p[0].y.toFixed(1)}`;for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=` C${(b.x+(c.x-a.x)/6).toFixed(1)},${(b.y+(c.y-a.y)/6).toFixed(1)} ${(c.x-(e.x-b.x)/6).toFixed(1)},${(c.y-(e.y-b.y)/6).toFixed(1)} ${c.x.toFixed(1)},${c.y.toFixed(1)}`}return d}
function renderTide(){
  const el=$('tide'),ds=state.date,d=parseD(ds);
  const head=`<h3>Sjávarföll <small>${d.getDate()}. ${MON[d.getMonth()].slice(0,3)}. · Reykjavík</small></h3>`;
  const td=tideDay(ds);
  if(!td){el.innerHTML=head+`<div class="empty" style="padding:14px 0">${tideErr?'Tókst ekki að sækja sjávarföll núna.':T?'Engin gögn fyrir þennan dag.':'Sæki…'}</div>`;return}
  const W_=320,H=124,l=6,r=6,t=18,b=18,vs=td.pts.map(p=>p.v),mn=Math.min(...vs)-.25,mx=Math.max(...vs)+.25;
  const X=m=>l+m/1440*(W_-l-r),Y=v=>t+(mx-v)/(mx-mn)*(H-t-b);
  const P=td.pts.map(p=>({x:X(p.m),y:Y(p.v)}));
  const line=smooth(P),area=line+` L${X(td.pts[td.pts.length-1].m).toFixed(1)},${H-b} L${X(td.pts[0].m).toFixed(1)},${H-b} Z`;
  let s=`<svg viewBox="0 0 ${W_} ${H}" role="img" aria-label="Sjávarfallalína"><defs><linearGradient id="tg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2a5f7a" stop-opacity=".35"/><stop offset="1" stop-color="#2a5f7a" stop-opacity=".05"/></linearGradient></defs>`;
  if(mn<0&&mx>0)s+=`<line x1="${l}" x2="${W_-r}" y1="${Y(0)}" y2="${Y(0)}" stroke="#bdb6a4" stroke-dasharray="3 3"/>`;
  [0,6,12,18,24].forEach(h=>{s+=`<line x1="${X(h*60)}" x2="${X(h*60)}" y1="${t}" y2="${H-b}" stroke="#e9e2d4"/><text x="${X(h*60)}" y="${H-4}" font-size="12" fill="#6d6a60" text-anchor="${h===0?'start':h===24?'end':'middle'}" font-family="Barlow Condensed" font-weight="600">${p2(h)}</text>`});
  s+=`<path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="#2a5f7a" stroke-width="2.4" stroke-linejoin="round"/>`;
  td.ex.forEach(e=>{s+=`<circle cx="${X(e.m)}" cy="${Y(e.v)}" r="3.6" fill="${e.hi?'#2a5f7a':'#faf7f0'}" stroke="#2a5f7a" stroke-width="2"/><text x="${X(e.m)}" y="${e.hi?Y(e.v)-7:Y(e.v)+14}" font-size="12.5" font-weight="700" fill="#1b1f23" text-anchor="middle" font-family="Barlow Condensed">${fmtT(e.m)}</text>`});
  if(ds===todayKey()){const n=new Date(),nm=n.getHours()*60+n.getMinutes();s+=`<line x1="${X(nm)}" x2="${X(nm)}" y1="${t-6}" y2="${H-b}" stroke="#c23a30" stroke-width="2"/><circle cx="${X(nm)}" cy="${t-6}" r="3" fill="#c23a30"/>`}
  s+='</svg>';
  const list=td.ex.map(e=>`<div class="${e.hi?'hi':''}">${e.hi?'Flóð':'Fjara'}<b>${fmtT(e.m)}</b>${num(e.v)} m</div>`).join('');
  el.innerHTML=head+s+`<div class="tx" style="grid-template-columns:repeat(${Math.max(2,Math.min(4,td.ex.length))},1fr)">${list}</div><div class="src">Spá frá Open-Meteo (sama og Strandvaktin) – ekki opinber sjávarfallatafla.</div>`;
}

/* ── MÁNAÐARYFIRLIT ───────────────────────────────────────────── */
function renderMonth(){
  const {y,m}=state.month;
  $('mtitle').textContent=MON[m]+' '+y;
  const first=new Date(y,m,1),off=(first.getDay()+6)%7,start=new Date(y,m,1-off);
  let h=['mán','þri','mið','fim','fös','lau','sun'].map(x=>`<div class="hd">${x}</div>`).join('');
  const t=todayKey();
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    if(i>=35&&d.getMonth()!==m)break;
    const ds=dkey(d),oth=d.getMonth()!==m,al=alertFor(ds),dow=d.getDay();
    const items=[];
    ['maja','elly','hjalmar'].forEach(w=>{
      if(w==='maja'&&!G.loaded)return;
      const {ev,chips}=laneData(w,ds,false);
      chips.filter(c=>!c.off&&!(al&&c.t===al.label)).forEach(c=>items.push({w,t:c.t,all:true}));
      ev.filter(e=>e.kind==='event'&&!e.cancelled).forEach(e=>items.push({w:e.who==='family'?'family':w,t:e.title,tm:fmtT(e.s)}));
    });
    const offDay=al&&al.type==='off'&&dow>0&&dow<6;
    const shown=items.slice(0,4);
    h+=`<button class="md${oth?' oth':''}${offDay?' off':''}${ds===t?' today':''}${ds===state.date?' sel':''}${items.length?' hasev':''}" data-d="${ds}"><span class="n">${d.getDate()}</span>${al&&dow>0&&dow<6?`<span class="al">${esc(al.label)}</span>`:''}${shown.map(x=>`<div class="it" style="--c:${WHO[x.w].c}">${x.tm?'<em>'+x.tm+'</em>':''}${esc(x.t)}</div>`).join('')}${items.length>4?`<div class="more">+${items.length-4} til</div>`:''}</button>`;
  }
  $('mg').innerHTML=h;
  document.querySelectorAll('#mg .md').forEach(b=>b.onclick=()=>{state.focus=null;$('ov').classList.remove('open');setDate(b.dataset.d);renderNext()});
}
function openMonth(){
  const d=parseD(state.date);state.month={y:d.getFullYear(),m:d.getMonth()};
  $('ov').classList.add('open');renderMonth();
  if(G.token)ensureMonth(state.month.y,state.month.m,false).then(renderMonth).catch(()=>{});
}
function moveMonth(n){
  let {y,m}=state.month;m+=n;if(m<0){m=11;y--}if(m>11){m=0;y++}
  state.month={y,m};renderMonth();
  if(G.token)ensureMonth(y,m,false).then(renderMonth).catch(()=>{});
}
$('monthbtn').onclick=openMonth;
$('mclose').onclick=()=>$('ov').classList.remove('open');
$('mprev').onclick=()=>moveMonth(-1);$('mnext').onclick=()=>moveMonth(1);
$('mtoday').onclick=()=>{const d=new Date();state.month={y:d.getFullYear(),m:d.getMonth()};renderMonth()};
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))$('ov').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('ov').classList.remove('open')});

/* ── KLUKKA + RÆSING ──────────────────────────────────────────── */
function tick(){
  const n=new Date();
  $('clock').textContent=hm(n);
  $('dow').textContent=DOW[n.getDay()];$('dn').textContent=n.getDate()+'. '+MON[n.getMonth()]+' '+n.getFullYear();
}
function renderAll(){renderDay();renderNext();renderTide();if($('ov').classList.contains('open'))renderMonth()}
tick();setInterval(tick,1000);
let lastDay=todayKey();
setInterval(()=>{
  const t=todayKey();
  if(t!==lastDay){if(state.date===lastDay)state.date=t;lastDay=t;if(G.token)initGoogle()}
  renderDay();renderNext();renderSky();
},60*1000);
setInterval(()=>{if(G.token&&G.loaded)initGoogle()},5*60*1000);
setInterval(loadWeather,30*60*1000);

(function boot(){
  setStatus('off');renderAll();loadWeather();loadTides();
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  const clean=()=>{try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}};
  if(h.get('access_token')){
    G.token=h.get('access_token');G.exp=saveTok(G.token,h.get('expires_in'));clean();initGoogle();
  }else if(h.get('error')){clean();setStatus('off')}
  else{
    const s=loadTok();
    if(s){G.token=s.t;G.exp=s.exp;initGoogle()}
    else if(wasConnected())trySilent();
  }
  if(G.exp)setTimeout(()=>{trySilent()},Math.max(15e3,G.exp-Date.now()-60e3));
})();

window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(renderDay,150)});
