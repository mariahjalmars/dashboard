<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heimili — Dagskrá</title>
<style>
  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --border: rgba(28,28,26,0.10);
    --text: #1C1C1A;
    --muted: #8A8880;
    --maja: #3B5EA6;
    --maja-bg: #EEF2FA;
    --elly: #7C4D8A;
    --elly-bg: #F3EDF6;
    --hjalmar: #2A7D4F;
    --hjalmar-bg: #E8F4EE;
    --tide: #4A8FA8;
    --tide-bg: #EBF4F7;
    --warn: #C45C2A;
    --warn-bg: #FAF0EA;
    --ok-bg: #E8F4EE;
    --ok: #2A7D4F;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1rem;
  }
  .dash { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
 
  /* Header */
  .header {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 1rem 1.25rem;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }
  .clock { font-size: 2.4rem; font-weight: 300; letter-spacing: -1px; color: var(--text); }
  .date { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
  .header-center { text-align: center; }
  .greeting { font-size: 1rem; font-weight: 500; }
  .school-status { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
  .weather-block { text-align: right; }
  .weather-temp { font-size: 1.6rem; font-weight: 300; }
  .weather-desc { font-size: 0.78rem; color: var(--muted); }
 
  /* Main grid */
  .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .main-grid { grid-template-columns: 1fr; } }
 
  /* Kids grid */
  .kids-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .kids-grid { grid-template-columns: 1fr; } }
 
  /* Cards */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 1rem 1.25rem;
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .card-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .card-title { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
  .card-action { margin-left: auto; font-size: 0.72rem; color: var(--muted); cursor: pointer; border: none; background: none; padding: 0; }
 
  /* Calendar events */
  .event {
    display: flex;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
  }
  .event:last-child { border-bottom: none; }
  .event-time { font-size: 0.75rem; color: var(--muted); min-width: 42px; padding-top: 1px; font-variant-numeric: tabular-nums; }
  .event-title { font-size: 0.87rem; line-height: 1.3; }
  .event-loc { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
  .event-pill {
    display: inline-block;
    font-size: 0.7rem;
    padding: 1px 7px;
    border-radius: 20px;
    font-weight: 500;
    white-space: nowrap;
  }
 
  /* School block */
  .school-block {
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .school-block strong { color: var(--text); font-weight: 500; }
 
  /* Tides */
  .tide-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .tide-stat { background: var(--tide-bg); border-radius: var(--radius-sm); padding: 7px 9px; }
  .tide-stat-label { font-size: 0.68rem; color: var(--tide); font-weight: 500; }
  .tide-stat-val { font-size: 1.1rem; font-weight: 500; color: var(--text); margin-top: 1px; }
  .tide-chart { display: flex; gap: 2px; align-items: flex-end; height: 44px; margin-top: 4px; }
  .tide-bar { flex: 1; border-radius: 2px 2px 0 0; }
  .tide-times { display: flex; justify-content: space-between; margin-top: 3px; }
  .tide-time-label { font-size: 0.65rem; color: var(--muted); }
 
  /* Traffic */
  .traffic-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
  .traffic-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; background: var(--bg); border-radius: var(--radius-sm); }
  .traffic-road { font-size: 0.82rem; }
  .traffic-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .badge-ok { background: var(--ok-bg); color: var(--ok); }
  .badge-warn { background: var(--warn-bg); color: var(--warn); }
 
  /* School alert */
  .school-alert { background: var(--warn-bg); border-left: 3px solid var(--warn); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 0.8rem; color: var(--warn); margin-bottom: 8px; }
 
  /* Connect button */
  .connect-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.8rem; padding: 7px 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: transparent; color: var(--text); cursor: pointer;
    transition: background 0.15s;
  }
  .connect-btn:hover { background: var(--bg); }
 
  /* Empty state */
  .empty { font-size: 0.82rem; color: var(--muted); padding: 8px 0; }
 
  /* Spinner */
  .spin { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--border); border-top-color: var(--maja); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
 
  /* Footer */
  .footer { text-align: center; font-size: 0.7rem; color: var(--muted); padding: 6px 0 2px; }
  .footer a { color: var(--muted); }
 
  /* Month button */
  .month-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer;
    font-size: 0.85rem; color: var(--muted);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .month-btn:hover { border-color: rgba(28,28,26,0.22); box-shadow: 0 2px 8px rgba(0,0,0,0.05); color: var(--text); }
 
  /* Month overlay */
  .month-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(28,28,26,0.5); z-index: 200;
    align-items: flex-start; justify-content: center;
    padding: 1rem; overflow-y: auto;
  }
  .month-overlay.open { display: flex; }
  .month-panel {
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border);
    width: 100%; max-width: 820px;
    padding: 1.25rem; margin: auto;
  }
  .month-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .month-nav { display: flex; align-items: center; gap: 12px; }
  .month-nav-btn { font-size: 1.1rem; color: var(--muted); cursor: pointer; border: none; background: none; padding: 2px 8px; border-radius: var(--radius-sm); }
  .month-nav-btn:hover { background: var(--bg); }
  .month-title { font-size: 1.1rem; font-weight: 500; min-width: 180px; text-align: center; }
  .month-close { font-size: 1.2rem; color: var(--muted); cursor: pointer; border: none; background: none; padding: 2px 8px; }
  .month-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--muted); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
  .cal-dow { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); text-align: center; padding: 4px 0 6px; }
  .cal-day { min-height: 72px; border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 5px 6px; background: var(--surface); position: relative; }
  .cal-day.other-month { background: var(--bg); opacity: 0.45; }
  .cal-day.today { border-color: var(--maja); border-width: 2px; }
  .cal-day.weekend { background: #FAFAF8; }
  .cal-day.school-holiday { background: #FEF6F0; }
  .cal-day-num { font-size: 0.75rem; font-weight: 500; color: var(--muted); margin-bottom: 3px; }
  .cal-day.today .cal-day-num { color: var(--maja); font-weight: 700; }
  .cal-event { font-size: 0.63rem; padding: 1px 5px; border-radius: 3px; margin-bottom: 2px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-holiday-label { font-size: 0.6rem; color: var(--warn); font-weight: 600; margin-bottom: 2px; }
 
  /* Kid card clickable */
  .kid-card { cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s; }
  .kid-card:hover { border-color: rgba(28,28,26,0.22); box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
 
  /* Detail overlay */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(28,28,26,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .overlay.open { display: flex; }
  .detail-panel {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    width: 100%; max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 1.25rem;
  }
  .detail-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .detail-name { font-size: 1.1rem; font-weight: 500; flex: 1; }
  .detail-close {
    font-size: 1.2rem; color: var(--muted); cursor: pointer;
    border: none; background: none; line-height: 1; padding: 2px 6px;
  }
  .timeline { position: relative; }
  .tl-hour {
    display: grid; grid-template-columns: 38px 1fr;
    gap: 0 10px; min-height: 40px; align-items: start;
  }
  .tl-time { font-size: 0.7rem; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; text-align: right; }
  .tl-line { border-top: 1px solid var(--border); padding-top: 2px; }
  .tl-block {
    border-radius: var(--radius-sm);
    padding: 5px 9px; margin-bottom: 3px;
    font-size: 0.8rem; line-height: 1.3;
  }
  .tl-block-title { font-weight: 500; }
  .tl-block-loc { font-size: 0.7rem; opacity: 0.75; margin-top: 1px; }
  .now-line { border-top: 2px solid var(--warn); position: relative; }
  .now-label { position: absolute; right: 0; top: -9px; font-size: 0.65rem; color: var(--warn); background: var(--surface); padding: 0 4px; }
</style>
</head>
<body>
<div class="dash">
 
  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="clock" id="clock">00:00</div>
      <div class="date" id="datestr"></div>
    </div>
    <div class="header-center">
      <div class="greeting" id="greeting">Góðan dag!</div>
      <div class="school-status" id="school-status"></div>
    </div>
    <div class="weather-block">
      <div class="weather-temp" id="weather-temp">—</div>
      <div class="weather-desc" id="weather-desc">Reykjavík</div>
    </div>
  </div>
 
  <!-- MAIN ROW: Calendar + Tides -->
  <div class="main-grid">
 
    <!-- MAJA CALENDAR -->
    <div class="card">
      <div class="card-header">
        <div class="card-dot" style="background:var(--maja)"></div>
        <span class="card-title">Maja — dagurinn í dag</span>
        <button class="card-action" id="cal-btn" onclick="startGoogleAuth()">tengja Google →</button>
      </div>
      <div id="maja-cal">
        <div class="empty">Smelltu á „tengja Google" til að sækja dagatal.</div>
      </div>
    </div>
 
    <!-- TIDES -->
    <div class="card">
      <div class="card-header">
        <div class="card-dot" style="background:var(--tide)"></div>
        <span class="card-title">Sjávarafall</span>
      </div>
      <div id="tide-content">
        <div class="empty"><span class="spin"></span></div>
      </div>
    </div>
 
  </div>
 
  <!-- KIDS ROW -->
  <div class="kids-grid">
 
    <!-- ELLY -->
    <div class="card kid-card" onclick="openDetail('elly')">
      <div class="card-header">
        <div class="card-dot" style="background:var(--elly)"></div>
        <span class="card-title">Elly</span>
        <span style="margin-left:auto;font-size:0.68rem;color:var(--muted);">dagskrá →</span>
      </div>
      <div id="elly-content"></div>
    </div>
 
    <!-- HJÁLMAR -->
    <div class="card kid-card" onclick="openDetail('hjalmar')">
      <div class="card-header">
        <div class="card-dot" style="background:var(--hjalmar)"></div>
        <span class="card-title">Hjálmar</span>
        <span style="margin-left:auto;font-size:0.68rem;color:var(--muted);">dagskrá →</span>
      </div>
      <div id="hjalmar-content"></div>
    </div>
 
  </div>
 
  <!-- DETAIL OVERLAY -->
  <div class="overlay" id="detail-overlay" onclick="closeDetail(event)">
    <div class="detail-panel" id="detail-panel">
      <div class="detail-header">
        <div class="card-dot" id="detail-dot" style="width:12px;height:12px;border-radius:50%;"></div>
        <span class="detail-name" id="detail-name"></span>
        <button class="detail-close" onclick="closeDetail()">✕</button>
      </div>
      <div id="detail-body"></div>
    </div>
  </div>
 
  <!-- TRAFFIC -->
  <div class="card">
    <div class="card-header">
      <div class="card-dot" style="background:#888"></div>
      <span class="card-title">Umferð — Reykjavík</span>
      <a href="https://vegasja.vegagerdin.is" target="_blank" class="card-action">vegasja.is →</a>
    </div>
    <div class="traffic-grid" id="traffic"></div>
  </div>
 
  <!-- MONTH CALENDAR BUTTON -->
  <button class="month-btn" onclick="openMonthCal()">
    📅 Mánaðaryfirlit — Maja · Elly · Hjálmar
  </button>
 
  <!-- MONTH OVERLAY -->
  <div class="month-overlay" id="month-overlay" onclick="closeMonthCal(event)">
    <div class="month-panel">
      <div class="month-header">
        <div class="month-nav">
          <button class="month-nav-btn" onclick="changeMonth(-1)">←</button>
          <span class="month-title" id="month-title"></span>
          <button class="month-nav-btn" onclick="changeMonth(1)">→</button>
        </div>
        <button class="month-close" onclick="closeMonthCal()">✕</button>
      </div>
      <div class="month-legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--maja)"></div>Maja</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--elly)"></div>Elly</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--hjalmar)"></div>Hjálmar</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--warn);opacity:0.6"></div>Skólafrí/starfsdagur</div>
      </div>
      <div class="cal-grid" id="month-grid"></div>
    </div>
  </div>
 
  <div class="footer">Uppfært <span id="last-update"></span> · <a href="https://mariahjalmars.is">mariahjalmars.is</a></div>
 
</div>
 
<script>
// ── SHARED HELPERS & GOOGLE STORE (defined first so everything below can use them) ──
const gStore = { token: null, calendars: [], events: new Map(), loadedMonths: new Set(), loaded: false };
const WHO_STYLE = {
  maja:    { color: 'var(--maja)',    bg: 'var(--maja-bg)' },
  elly:    { color: 'var(--elly)',    bg: 'var(--elly-bg)' },
  hjalmar: { color: 'var(--hjalmar)', bg: 'var(--hjalmar-bg)' },
  family:  { color: '#5F5E5A',        bg: '#EFEEE9' },
};
function pad2(n) { return String(n).padStart(2, '0'); }
function localDateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function hhmm(d) { return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
 
// ── CLOCK & DATE ──────────────────────────────────────────────
const DAYS_IS = ['Sunnudagur','Mánudagur','Þriðjudagur','Miðvikudagur','Fimmtudagur','Föstudagur','Laugardagur'];
const MONTHS_IS = ['janúar','febrúar','mars','apríl','maí','júní','júlí','ágúst','september','október','nóvember','desember'];
const DAY_SHORT = ['sun','mán','þri','mið','fim','fös','lau'];
 
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = h + ':' + m;
  document.getElementById('datestr').textContent =
    DAYS_IS[now.getDay()] + ', ' + now.getDate() + '. ' + MONTHS_IS[now.getMonth()] + ' ' + now.getFullYear();
  document.getElementById('last-update').textContent =
    now.toLocaleTimeString('is-IS',{hour:'2-digit',minute:'2-digit'});
 
  const hr = now.getHours();
  const greet = hr < 12 ? 'Góðan morgun!' : hr < 17 ? 'Góðan dag!' : 'Gott kvöld!';
  document.getElementById('greeting').textContent = greet;
}
updateClock();
setInterval(updateClock, 1000);
 
// ── SCHOOL CALENDAR ───────────────────────────────────────────
const SCHOOL_ALERTS = [
  { from: '2026-09-30', to: '2026-09-30', label: 'Starfsdagur — enginn skóli' },
  { from: '2026-10-22', to: '2026-10-26', label: 'Vetrarfrí 🏔' },
  { from: '2026-12-18', to: '2026-12-18', label: 'Kennsla til hádegis' },
  { from: '2026-12-19', to: '2026-12-19', label: 'Jólastund — lýkur til hádegis' },
  { from: '2026-12-20', to: '2027-01-05', label: 'Jólafrí ❄' },
  { from: '2027-01-22', to: '2027-01-22', label: 'Kennt til hádegis' },
  { from: '2027-02-23', to: '2027-02-27', label: 'Vetrarfrí 🏔' },
  { from: '2027-03-25', to: '2027-04-01', label: 'Páskavika 🐣' },
  { from: '2027-05-06', to: '2027-05-06', label: 'Uppstigningardagur — frí' },
  { from: '2027-05-14', to: '2027-05-15', label: 'Starfsdagar — enginn skóli' },
  { from: '2027-06-10', to: '2027-06-10', label: 'Skólaslit 🎉' },
];
 
function getSchoolAlert(dateStr) {
  return SCHOOL_ALERTS.find(a => dateStr >= a.from && dateStr <= a.to);
}
 
// ── KIDS SCHEDULE DATA ────────────────────────────────────────
// School: Mon–Fri 08:50–~14:00
// dow: 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
 
const ELLY_ACTIVITIES = [
  // Leiklist: Tue+Thu 16:30–18:30, runs all autumn
  { dow:[2,4], start:'16:30', end:'18:30', title:'Leiklist', loc:'Borgarleikhúsið', color:'var(--elly)', from:'2026-09-08', until:'2026-12-19' },
  // Fimleikar: Mon/Wed/Thu 18:00–20:30
  { dow:[1,3,4], start:'18:00', end:'20:30', title:'2.fl. Fimleikar — þrjátt', loc:'Grótta', color:'var(--elly)', until:'2026-12-19' },
  // Fimleikar Sun: 50/50 æfing 16:00–19:00
  { dow:[0], start:'16:00', end:'19:00', title:'2.fl. Fimleikar — 50/50', loc:'Grótta', color:'var(--elly)', until:'2026-12-19' },
  // Fimleikar Sat: 18:00–20:30
  { dow:[6], start:'18:00', end:'20:30', title:'2.fl. Fimleikar', loc:'Grótta', color:'var(--elly)', until:'2026-12-19' },
];
 
const HJALMAR_ACTIVITIES = [
  // Fótbolti æfing: Tue/Wed/Fri 15:30–17:30, only September
  { dow:[2,3,5], start:'15:30', end:'17:30', title:'Fótboltaæfing 4.flokks', loc:'KR, Frostaskjól', color:'var(--hjalmar)', until:'2026-09-30' },
  // C-lið leikur: occasional Thu — specific dates hardcoded below
];
 
// Specific one-off events
const HJALMAR_ONEOFF = [
  { date:'2026-09-10', start:'17:30', end:'18:40', title:'C-lið leikur vs Njarðvík', loc:'KR-völlur', color:'var(--hjalmar)' },
];
 
const ELLY_ONEOFF = [
  { date:'2026-09-24', start:'20:00', end:'21:30', title:'FermingarReunion', loc:'Neskirkja', color:'var(--elly)' },
  { date:'2026-11-09', allDay:true, title:'Skrekkur', loc:'', color:'var(--elly)' },
];
const SHARED_ONEOFF = [];
 
const SCHOOL_START = '08:50';
const SCHOOL_END_NORMAL = '13:40';
// Elly: Tue+Thu longer (Stuðningur í stærðfræði Tue, Sálfræði Thu)
const ELLY_SCHOOL_END = { 2:'15:00', 4:'15:00' };
// Hjálmar: Mon+Thu longer (Stuðningur í íslensku Mon, Spænska Thu)
const HJALMAR_SCHOOL_END = { 1:'15:00', 4:'15:00' };
 
// Full timetable for detail view — from InfoMentor PDFs

function todayStr() {
  return localDateKey(new Date());
}
 
function isWeekday(dow) { return dow >= 1 && dow <= 5; }
 
function getKidSchedule(activities, oneoffs, schoolEndMap, who) {
  const now = new Date();
  const dow = now.getDay();
  const ds = todayStr();
  const items = [];
 
  // School
  if (isWeekday(dow)) {
    const alert = getSchoolAlert(ds);
    const isStarfsdagur = alert && alert.label.includes('Starfsdagur');
    const isHalfDay = alert && alert.label.includes('hádegis');
    if (!isStarfsdagur && !(alert && alert.label.includes('frí'))) {
      const endStr = isHalfDay ? '12:30' : (schoolEndMap[dow] || SCHOOL_END_NORMAL);
      items.push({ time: SCHOOL_START + '–' + endStr, title: 'Skóli', loc: 'Hagaskóli', color: '#888' });
    }
  }
 
  // Recurring activities — hardcoded fallback, only used until Google Calendar (Abler) is connected
  if (!gStore.loaded) {
    activities.forEach(a => {
      if (a.dow.includes(dow) && ds <= a.until && ds >= (a.from || '2026-08-24')) {
        items.push({ time: a.start + '–' + a.end, title: a.title, loc: a.loc, color: a.color });
      }
    });
  }
 
  // One-off (hardcoded, e.g. Skrekkur)
  oneoffs.forEach(o => {
    if (o.date === ds) {
      if (o.allDay) items.push({ time: '00:00–00:00', allDay: true, title: o.title, loc: o.loc, color: o.color });
      else items.push({ time: o.start + '–' + o.end, title: o.title, loc: o.loc, color: o.color });
    }
  });
 
  // Google Calendar events (Abler + the kids' own calendars)
  if (gStore.loaded) {
    gEventsFor(ds, [who]).forEach(e => {
      const color = WHO_STYLE[who].color;
      if (e.allDay) items.push({ time: '00:00–00:00', allDay: true, title: e.title, loc: e.loc, color });
      else items.push({ time: e.start + '–' + e.end, title: e.title, loc: e.loc, color });
    });
  }
 
  items.sort((a,b) => a.time.localeCompare(b.time));
  return items;
}
 
function renderKidSchedule(elId, activities, oneoffs, schoolEndMap, name) {
  const now = new Date();
  const dow = now.getDay();
  const ds = todayStr();
  const el = document.getElementById(elId);
  const alert = getSchoolAlert(ds);
  let html = '';
 
  if (alert) {
    html += `<div class="school-alert">${alert.label}</div>`;
  }
 
  if (!isWeekday(dow)) {
    html += `<div class="school-block">Enginn skóli í dag 🏠</div>`;
  }
 
  const who = name === 'Elly' ? 'elly' : 'hjalmar';
  const items = getKidSchedule(activities, oneoffs, schoolEndMap, who);
 
  if (items.length === 0) {
    html += `<div class="empty">Ekkert skráð í dag.</div>`;
  } else {
    items.forEach(item => {
      html += `<div class="event">
        <div class="event-time">${item.allDay ? 'Allur dagur' : item.time.split('–')[0]}</div>
        <div>
          <div class="event-title">${esc(item.title)}</div>
          ${item.loc ? `<div class="event-loc">${esc(item.loc)}</div>` : ''}
        </div>
      </div>`;
    });
  }
 
  // Next notable event if today is empty/weekend
  if (!isWeekday(dow)) {
    const nextAct = getNextActivity(activities, oneoffs, who);
    if (nextAct) {
      html += `<div style="margin-top:8px;font-size:0.75rem;color:var(--muted);">Næst: ${nextAct.title} ${nextAct.when}</div>`;
    }
  }
 
  el.innerHTML = html;
}
 
function getNextActivity(activities, oneoffs, who) {
  const now = new Date();
  for (let i = 1; i <= 7; i++) {
    const d = new Date(now); d.setDate(d.getDate() + i);
    const ds = localDateKey(d);
    const dow = d.getDay();
    if (!gStore.loaded) {
      for (const a of activities) {
        if (a.dow.includes(dow) && ds <= a.until && ds >= (a.from || '2026-08-24')) {
          return { title: a.title, when: DAYS_IS[dow].toLowerCase() };
        }
      }
    }
    for (const o of oneoffs) {
      if (o.date === ds) return { title: o.title, when: DAYS_IS[dow].toLowerCase() };
    }
    if (gStore.loaded) {
      const e = gEventsFor(ds, [who])[0];
      if (e) return { title: esc(e.title), when: DAYS_IS[dow].toLowerCase() + (e.allDay ? '' : ' kl. ' + e.start) };
    }
  }
  return null;
}

// ── TIDES ─────────────────────────────────────────────────────
async function fetchTides() {
  const el = document.getElementById('tide-content');
  try {
    const now = new Date();
    // Generate synthetic tide data (Reykjavík ~1.8m range, semi-diurnal)
    const tides = [];
    for (let h = 0; h < 24; h++) {
      const v = 1.1 + 0.95 * Math.sin((h * Math.PI) / 12.4 - 1.2) + 0.3 * Math.sin((h * Math.PI) / 6.2);
      tides.push({ h, v: Math.max(0.1, v) });
    }
    // Try real API
    const ds = now.toISOString().split('T')[0].replace(/-/g,'');
    try {
      const r = await fetch(`https://api.met.no/weatherapi/tidalwater/0.1/?lat=64.1355&lon=-21.8954`, {signal: AbortSignal.timeout(4000)});
      // met.no may work — if not, we use synthetic
    } catch(e) {}
 
    renderTides(tides, now.getHours());
  } catch(e) {
    document.getElementById('tide-content').innerHTML = '<div class="empty">Gat ekki sótt sjávarfallagögn.</div>';
  }
}
 
function renderTides(tides, nowH) {
  const max = Math.max(...tides.map(t=>t.v));
  const min = Math.min(...tides.map(t=>t.v));
  const pct = v => Math.max(8, Math.round((v-min)/(max-min)*100));
 
  const highs = [], lows = [];
  for (let i=1; i<tides.length-1; i++) {
    if (tides[i].v > tides[i-1].v && tides[i].v > tides[i+1].v) highs.push(tides[i]);
    if (tides[i].v < tides[i-1].v && tides[i].v < tides[i+1].v) lows.push(tides[i]);
  }
  const nextHigh = highs.find(t=>t.h>nowH);
  const nextLow = lows.find(t=>t.h>nowH);
  const nowVal = tides[nowH]?.v.toFixed(1) || '—';
 
  const bars = tides.map(t => {
    const isNow = t.h === nowH;
    const past = t.h < nowH;
    const bg = isNow ? 'var(--tide)' : past ? '#D3D1C7' : '#B5D4F4';
    return `<div class="tide-bar" style="height:${pct(t.v)}%;background:${bg};opacity:${past?0.4:1};"></div>`;
  }).join('');
 
  const keyH = [0,6,12,18,23];
  const labels = keyH.map(h=>`<span class="tide-time-label">${String(h).padStart(2,'0')}:00</span>`).join('');
 
  document.getElementById('tide-content').innerHTML = `
    <div class="tide-stats">
      <div class="tide-stat">
        <div class="tide-stat-label">Núna</div>
        <div class="tide-stat-val">${nowVal}m</div>
      </div>
      <div class="tide-stat">
        <div class="tide-stat-label">Næst hátt</div>
        <div class="tide-stat-val">${nextHigh ? String(nextHigh.h).padStart(2,'0')+':00' : '—'}</div>
      </div>
    </div>
    <div class="tide-chart">${bars}</div>
    <div class="tide-times">${labels}</div>
    <div style="margin-top:5px;font-size:0.65rem;color:var(--muted);">Reykjavíkurhöfn · lilla = núna</div>`;
}

function openDetail(kid) {
  const isElly = kid === 'elly';
  const color = isElly ? 'var(--elly)' : 'var(--hjalmar)';
  const name = isElly ? 'Elly' : 'Hjálmar';
  const timetable = isElly ? ELLY_TIMETABLE : HJALMAR_TIMETABLE;
  const activities = isElly ? ELLY_ACTIVITIES : HJALMAR_ACTIVITIES;
  const oneoffs = isElly ? ELLY_ONEOFF : HJALMAR_ONEOFF;
 
  document.getElementById('detail-dot').style.background = color;
  document.getElementById('detail-name').textContent = name + ' — ' + new Date().toLocaleDateString('is-IS',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('detail-overlay').classList.add('open');
 
  const now = new Date();
  const dow = now.getDay();
  const ds = todayStr();
  const nowMin = now.getHours() * 60 + now.getMinutes();
 
  // Build merged list: school slots + activities
  let slots = [];
 
  if (isWeekday(dow)) {
    const alert = getSchoolAlert(ds);
    const isStarfs = alert && alert.label.includes('Starfsdagur');
    const isHalfDay = alert && alert.label.includes('hádegis');
 
    if (!isStarfs && !(alert && alert.label.includes('frí'))) {
      const daySlots = timetable[dow] || [];
      daySlots.forEach(([s,e,subj]) => {
        if (subj === 'Matur') return; // skip lunch in detail
        const endAdj = isHalfDay && toMin(e) > 12*60+30 ? '12:30' : e;
        slots.push({ start:s, end:endAdj, title:subj, loc:'Hagaskóli', color:'#888', school:true });
      });
    }
  }
 
  // Activities — hardcoded fallback until Google Calendar (Abler) is connected
  if (!gStore.loaded) {
    activities.forEach(a => {
      if (a.dow.includes(dow) && ds <= a.until && ds >= (a.from || '2026-08-24')) {
        slots.push({ start:a.start, end:a.end, title:a.title, loc:a.loc, color:isElly?'var(--elly)':'var(--hjalmar)', school:false });
      }
    });
  }
  const allDayItems = [];
  oneoffs.forEach(o => {
    if (o.date !== ds) return;
    if (o.allDay) allDayItems.push(o);
    else slots.push({ start:o.start, end:o.end, title:o.title, loc:o.loc, color:o.color, school:false });
  });
  if (gStore.loaded) {
    gEventsFor(ds, [kid]).forEach(e => {
      if (e.allDay) allDayItems.push({ title:e.title, loc:e.loc, color:color });
      else slots.push({ start:e.start, end:e.end, title:e.title, loc:e.loc, color:color, school:false });
    });
  }
 
  slots.sort((a,b) => a.start.localeCompare(b.start));
 
  // Render timeline from 08:00 to last event end or 21:00
  const startH = 8;
  const endH = slots.length ? Math.max(21, toMin(slots[slots.length-1].end)/60 + 1) : 21;
 
  let html = '<div class="timeline">';
  const alert2 = getSchoolAlert(ds);
  if (alert2) html += `<div class="school-alert" style="margin-bottom:12px;">${alert2.label}</div>`;
  if (!isWeekday(dow)) html += `<div class="empty" style="margin-bottom:12px;">Enginn skóli í dag 🏠</div>`;
  allDayItems.forEach(o => {
    html += `<div class="tl-block" style="background:${o.color};color:white;margin-bottom:10px;">
      <div class="tl-block-title">${esc(o.title)} <span style="font-weight:400;font-size:0.72rem;">Allur dagur</span></div>
      ${o.loc ? `<div class="tl-block-loc" style="color:rgba(255,255,255,0.8);">${esc(o.loc)}</div>` : ''}
    </div>`;
  });
 
  for (let h = startH; h < endH; h++) {
    const hMin = h * 60;
    const slotHere = slots.filter(s => toMin(s.start) >= hMin && toMin(s.start) < hMin + 60);
    const isNowHour = now.getHours() === h;
 
    html += `<div class="tl-hour">
      <div class="tl-time">${String(h).padStart(2,'0')}:00</div>
      <div>
        <div class="tl-line ${isNowHour ? 'now-line' : ''}">
          ${isNowHour ? '<span class="now-label">núna</span>' : ''}
        </div>`;
 
    slotHere.forEach(s => {
      const schoolBg = s.school ? '#F5F5F3' : '';
      const textColor = s.school ? 'var(--text)' : 'white';
      const bg = s.school ? schoolBg : s.color;
      const border = s.school ? `border-left: 3px solid #ccc;` : '';
      const tc = s.school ? 'var(--text)' : 'white';
      html += `<div class="tl-block" style="background:${bg};${border}color:${tc};">
        <div class="tl-block-title">${esc(s.title)} <span style="font-weight:400;font-size:0.72rem;">${s.start}–${s.end}</span></div>
        <div class="tl-block-loc" style="color:${s.school?'var(--muted)':'rgba(255,255,255,0.8)'};">${esc(s.loc)}</div>
      </div>`;
    });
 
    html += '</div></div>';
  }
 
  if (slots.length === 0 && !isWeekday(dow)) {
    html += '<div class="empty">Ekkert skráð í dag.</div>';
  }
 
  html += '</div>';
  document.getElementById('detail-body').innerHTML = html;
}
 
function toMin(timeStr) {
  const [h,m] = timeStr.split(':').map(Number);
  return h*60 + (m||0);
}

    document.getElementById('detail-overlay').classList.remove('open');
  }
}

// Get all events for a given date string YYYY-MM-DD
function getEventsForDate(ds) {
  const d = new Date(ds + 'T12:00:00');
  const dow = d.getDay();
  const events = [];
 
  // School alert
  const alert = getSchoolAlert(ds);
  if (alert) events.push({ label: alert.label, color: 'var(--warn)', bg: '#FEF6F0', who: 'all' });
 
  // Hardcoded recurring activities — fallback until Google Calendar (Abler) is connected
  if (!gStore.loaded) {
    ELLY_ACTIVITIES.forEach(a => {
      if (a.dow.includes(dow) && ds <= a.until && ds >= (a.from || '2026-08-24')) {
        events.push({ label: a.title, color: 'var(--elly)', bg: 'var(--elly-bg)', who: 'elly' });
      }
    });
    HJALMAR_ACTIVITIES.forEach(a => {
      if (a.dow.includes(dow) && ds <= a.until && ds >= (a.from || '2026-08-24')) {
        events.push({ label: a.title, color: 'var(--hjalmar)', bg: 'var(--hjalmar-bg)', who: 'hjalmar' });
      }
    });
  }
 
  // Hardcoded one-offs (e.g. Skrekkur)
  ELLY_ONEOFF.forEach(o => {
    if (o.date === ds) events.push({ label: o.title, color: 'var(--elly)', bg: 'var(--elly-bg)', who: 'elly' });
  });
  HJALMAR_ONEOFF.forEach(o => {
    if (o.date === ds) events.push({ label: o.title, color: 'var(--hjalmar)', bg: 'var(--hjalmar-bg)', who: 'hjalmar' });
  });
 
  // Google Calendar events: Maja, family, and the kids (Abler + their own calendars)
  gEventsFor(ds).forEach(e => {
    const st = WHO_STYLE[e.who] || WHO_STYLE.family;
    events.push({ label: esc((e.allDay ? '' : e.start + ' ') + e.title), color: st.color, bg: st.bg, who: e.who });
  });
 
  return events;
}

  const DOW_SHORT = ['Mán','Þri','Mið','Fim','Fös','Lau','Sun'];
  document.getElementById('month-title').textContent = MONTHS_LONG[calMonth] + ' ' + calYear;
 
  const grid = document.getElementById('month-grid');
  let html = DOW_SHORT.map(d => `<div class="cal-dow">${d}</div>`).join('');
 
  // First day of month — adjust so week starts Monday
  const firstDay = new Date(calYear, calMonth, 1);
  let startDow = firstDay.getDay(); // 0=Sun
  startDow = startDow === 0 ? 6 : startDow - 1; // Mon=0
 
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();
  const today = new Date();
  const todayDs = todayStr();
 
  let dayCount = 1;
  let nextCount = 1;
 
  // Total cells needed
  const totalCells = Math.ceil((startDow + daysInMonth) / 7) * 7;
 
  for (let i = 0; i < totalCells; i++) {
    let dayNum, ds, inMonth;
    if (i < startDow) {
      dayNum = daysInPrev - startDow + i + 1;
      const pm = calMonth === 0 ? 11 : calMonth - 1;
      const py = calMonth === 0 ? calYear - 1 : calYear;
      ds = `${py}-${String(pm+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
      inMonth = false;
    } else if (dayCount <= daysInMonth) {
      dayNum = dayCount++;
      ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
      inMonth = true;
    } else {
      dayNum = nextCount++;
      const nm = calMonth === 11 ? 0 : calMonth + 1;
      const ny = calMonth === 11 ? calYear + 1 : calYear;
      ds = `${ny}-${String(nm+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
      inMonth = false;
    }
 
    const d = new Date(ds + 'T12:00:00');
    const dow = d.getDay(); // 0=Sun, 6=Sat
    const isWeekend = dow === 0 || dow === 6;
    const isToday = ds === todayDs;
    const alert = getSchoolAlert(ds);
    const isHoliday = alert && inMonth;
 
    let classes = 'cal-day';
    if (!inMonth) classes += ' other-month';
    if (isToday) classes += ' today';
    if (isWeekend) classes += ' weekend';
    if (isHoliday) classes += ' school-holiday';
 
    const events = inMonth ? getEventsForDate(ds) : [];
    const evHtml = events.slice(0,4).map(ev =>
      `<div class="cal-event" style="background:${ev.bg};color:${ev.color};">${ev.label}</div>`
    ).join('');
    const moreHtml = events.length > 4 ? `<div style="font-size:0.6rem;color:var(--muted);">+${events.length-4} fleiri</div>` : '';
 
    html += `<div class="${classes}">
      <div class="cal-day-num">${dayNum}</div>
      ${isHoliday ? `<div class="cal-holiday-label">${alert.label.split('—')[0].trim()}</div>` : ''}
      ${evHtml}${moreHtml}
    </div>`;
  }
 
  grid.innerHTML = html;
}
 
// ── GOOGLE CALENDAR ───────────────────────────────────────────
// Reads ALL of Maja's calendars: her own, ÍMARK board, Family, the kids' own
// calendars and the Abler sync calendar (events are tagged "Elly …" / "Hjálmar …").
const CLIENT_ID = '865507997051-8a0l6dpl5dsk278mpnll9spmfqs1re79.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
 
function startGoogleAuth() {
  const url = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(location.href.split('#')[0])}&response_type=token&scope=${encodeURIComponent(SCOPE)}`;
  window.location.href = url;
}
 
// Which "kind" of calendar is this?
// Accent- and case-insensitive text for matching names. Google can send "á" either as one
// character or as "a" + a combining accent; folding makes "Hjálmar" match both.
function fold(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}
 
function classifyCalendar(c) {
  const name = fold(c.summaryOverride || c.summary).trim();
  const id = c.id || '';
  if (id.includes('#holiday@')) return null;            // Icelandic holidays — school calendar already covers this
  if (name.startsWith('abler')) return 'abler';          // Abler sync (both kids in one calendar)
  if (name === 'elly') return 'elly';
  if (name === 'hjalmar') return 'hjalmar';
  if (name === 'family') return 'family';
  if (c.primary) return 'maja';
  if (id.endsWith('@import.calendar.google.com')) return null; // other imported feeds
  return 'maja';                                         // e.g. Stjórn ÍMARK
}
 
function shortLoc(loc) {
  if (!loc) return '';
  const parts = loc.split(',').map(s => s.trim()).filter(s => s && !['Iceland', 'Reykjavík', 'Reykjavik'].includes(s));
  return parts.slice(0, 2).join(', ');
}
 
function normalizeEvent(ev, cal) {
  if (!ev || ev.status === 'cancelled' || !ev.start) return null;
  const allDay = !!ev.start.date;
  let who = cal.kind;
  let title = (ev.summary || '(atburður)').normalize('NFC');
 
  if (cal.kind === 'abler') {
    // "Elly Margrethe S. · 2.stig A/B – Leiklist 2. stig B"            →  elly, "Leiklist 2. stig B"
    // "Aflýst: Hjálmar Sand · 3.flokkur kk – Fótboltaæfing"             →  hjalmar, "Aflýst: Fótboltaæfing"
    const dot = title.indexOf('·');
    if (dot > -1) {
      const head = fold(title.slice(0, dot));
      const cancelled = /^afl[a-z]*st\b/.test(head);
      if (head.includes('elly')) who = 'elly';
      else if (head.includes('hjalmar')) who = 'hjalmar';
      else who = 'family';
      title = title.slice(dot + 1).trim();
      const dash = title.indexOf(' – ');
      if (dash > -1) title = title.slice(dash + 3);
      if (cancelled) title = 'Aflýst: ' + title;
    } else {
      const f = fold(title);
      who = f.includes('hjalmar') ? 'hjalmar' : f.includes('elly') ? 'elly' : 'family';
      const dash = title.indexOf(' – ');
      if (dash > -1) title = title.slice(dash + 3);
    }
  }
 
  const e = { key: cal.id + '|' + ev.id, who, title: title.trim(), loc: shortLoc(ev.location), allDay };
  if (allDay) {
    e.date = ev.start.date;
    e.endDate = (ev.end && ev.end.date) || ev.start.date;
  } else {
    const s = new Date(ev.start.dateTime);
    const en = new Date(ev.end.dateTime);
    e.date = localDateKey(s);
    e.start = hhmm(s);
    e.end = hhmm(en);
    e.endTs = en.getTime();
  }
  return e;
}
 
// All events on a given day (YYYY-MM-DD), optionally limited to some people
function gEventsFor(ds, whos) {
  const list = [];
  const seen = new Set();
  gStore.events.forEach(e => {
    if (whos && !whos.includes(e.who)) return;
    const hit = e.allDay ? (ds >= e.date && (ds < e.endDate || ds === e.date)) : e.date === ds;
    if (!hit) return;
    // A person can't be in two places at once: drop exact duplicates (same person + same time)
    const dupKey = e.allDay ? null : e.who + '|' + e.date + '|' + e.start + '|' + e.end;
    if (dupKey) { if (seen.has(dupKey)) return; seen.add(dupKey); }
    list.push(e);
  });
  list.sort((a, b) => (b.allDay - a.allDay) || (a.start || '').localeCompare(b.start || '') || a.title.localeCompare(b.title));
  return list;
}
 
async function gFetch(url) {
  const r = await fetch(url, { headers: { Authorization: 'Bearer ' + gStore.token } });
  if (r.status === 401) { gAuthLost(); throw new Error('auth'); }
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
 
function gAuthLost() {
  gStore.token = null;
  const btn = document.getElementById('cal-btn');
  if (btn) btn.textContent = 'tengjast aftur →';
}
 
async function loadCalendars() {
  const d = await gFetch('https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=100');
  gStore.calendars = (d.items || [])
    .map(c => ({ id: c.id, kind: classifyCalendar(c) }))
    .filter(c => c.kind);
}
 
// Load one calendar month for every calendar (cached unless force)
async function ensureMonth(year, month, force) {
  if (!gStore.token) return;
  const key = year + '-' + month;
  if (!force && gStore.loadedMonths.has(key)) return;
  const min = encodeURIComponent(new Date(year, month, 1).toISOString());
  const max = encodeURIComponent(new Date(year, month + 1, 1).toISOString());
  let failed = false;
  const batches = await Promise.all(gStore.calendars.map(async cal => {
    try {
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?timeMin=${min}&timeMax=${max}&singleEvents=true&orderBy=startTime&maxResults=250`;
      const d = await gFetch(url);
      return (d.items || []).map(ev => normalizeEvent(ev, cal)).filter(Boolean);
    } catch (e) { failed = true; return []; }
  }));
  if (!failed) {
    // Drop old copies of this month so deleted/moved events disappear
    const prefix = year + '-' + pad2(month + 1);
    gStore.events.forEach((e, k) => { if (e.date.startsWith(prefix)) gStore.events.delete(k); });
  }
  batches.flat().forEach(e => gStore.events.set(e.key, e));
  if (!failed) gStore.loadedMonths.add(key);
}
 
// Maja's card: what's left of today (her calendars + family)
function renderMajaToday() {
  const el = document.getElementById('maja-cal');
  if (!el) return;
  const nowTs = Date.now();
  const list = gEventsFor(todayStr(), ['maja', 'family']).filter(e => e.allDay || e.endTs >= nowTs);
  if (!list.length) {
    el.innerHTML = '<div class="empty">Enginn viðburður eftir í dag.</div>';
    return;
  }
  el.innerHTML = list.map(e => `<div class="event">
      <div class="event-time">${e.allDay ? 'Allur dagur' : e.start}</div>
      <div>
        <div class="event-title">${esc(e.title)}${e.who === 'family' ? ' <span style="font-size:0.68rem;color:var(--muted);">· fjölskyldan</span>' : ''}</div>
        ${e.loc ? `<div class="event-loc">${esc(e.loc)}</div>` : ''}
      </div>
    </div>`).join('');
}
 
function renderGoogleViews() {
  renderMajaToday();
  refreshKids();
  if (document.getElementById('month-overlay').classList.contains('open')) renderMonthCal();
}
 
async function initGoogle(token) {
  gStore.token = token;
  const btn = document.getElementById('cal-btn');
  if (btn) btn.textContent = '⟳ sæki dagatöl…';
  try {
    await loadCalendars();
    const now = new Date();
    await ensureMonth(now.getFullYear(), now.getMonth(), true);
    const nm = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    await ensureMonth(nm.getFullYear(), nm.getMonth(), true); // lets "Næst:" look across month end
    gStore.loaded = true;
    if (btn && gStore.token) btn.textContent = 'samstillt ✓';
    renderGoogleViews();
  } catch (e) {
    if (gStore.token) {
      if (btn) btn.textContent = 'villa — reyna aftur';
      const el = document.getElementById('maja-cal');
      if (el) el.innerHTML = '<div class="empty">Gat ekki sótt dagatöl.</div>';
    }
  }
}
 
// Keep fresh: re-sync every 5 minutes, re-draw "what's left today" every minute
